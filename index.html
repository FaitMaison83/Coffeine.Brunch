    #cb-showcase-v2 .bar{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:20px;border-bottom:1px solid rgba(255,255,255,.46)}
    #cb-showcase-v2 .logo{font-weight:700;letter-spacing:.02em}.logo i{font-style:normal;color:var(--yellow)}
    #cb-showcase-v2 .switch{display:flex;background:rgba(10,28,31,.82);border-radius:999px;padding:3px}
    #cb-showcase-v2 .switch button{border:0;background:transparent;color:rgba(255,255,255,.7);padding:9px 11px;border-radius:999px;font:inherit;font-size:12px;font-weight:700}
    #cb-showcase-v2 .switch button.on{background:var(--yellow);color:var(--navy)}
    #cb-showcase-v2 .hero-copy{position:absolute;left:22px;right:22px;bottom:34px;z-index:2}
    #cb-showcase-v2 .tag{text-transform:uppercase;letter-spacing:.15em;font-size:12px;font-weight:700;color:var(--yellow)}
    #cb-showcase-v2 h1,#cb-showcase-v2 h2,#cb-showcase-v2 h3{font-family:Georgia,serif;font-weight:500;letter-spacing:-.035em}
    #cb-showcase-v2 h1{font-size:52px;line-height:1.02;margin:12px 0 18px;max-width:390px}
    #cb-showcase-v2 .lead{font-size:17px;line-height:1.5;margin:0 0 22px;color:white;max-width:340px;text-shadow:0 1px 8px rgba(0,0,0,.45)}
    #cb-showcase-v2 .primary{display:inline-block;border:0;background:var(--yellow);color:var(--navy);border-radius:999px;padding:15px 18px;font:inherit;font-weight:700;text-decoration:none;width:max-content}
    #cb-showcase-v2 section{padding:58px 22px}
    #cb-showcase-v2 .intro{background:var(--cream)}

    #cb-showcase-v2 .photo-feature:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,rgba(8,20,20,.82))}
    #cb-showcase-v2 .photo-copy{position:absolute;z-index:2;bottom:24px;left:22px;right:22px;color:white}
    #cb-showcase-v2 .photo-copy h3{font-size:31px;margin:0 0 6px}.photo-copy p{margin:0;color:rgba(255,255,255,.84)}
    #cb-showcase-v2 .menu{background:var(--navy);color:white}
    #cb-showcase-v2 .menu h2{margin-bottom:26px}
    #cb-showcase-v2 .menu-list{display:grid;gap:13px}
    #cb-showcase-v2 .dish{display:grid;grid-template-columns:94px 1fr;background:#213d42;overflow:hidden;border-radius:14px;min-height:105px}
    #cb-showcase-v2 .dish img{width:94px;height:100%;object-fit:cover}
    #cb-showcase-v2 .dish div{padding:16px}.dish h3{font-size:20px;margin:0 0 6px;color:white}.dish p{font-size:13px;line-height:1.4;margin:0;color:#d7e0de}
    #cb-showcase-v2 .menu-cta{text-align:center;margin-top:22px}
    #cb-showcase-v2 .menu-note{font-size:12px;color:#c6d1cf;margin:0 0 14px;line-height:1.5}
    #cb-showcase-v2 .gallery{background:#f1c854;padding:0}
    #cb-showcase-v2 .gallery-title{padding:50px 22px 24px}.gallery-title h2{margin-bottom:0}
    #cb-showcase-v2 .gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
    #cb-showcase-v2 .gallery-grid img{display:block;width:100%;height:210px;object-fit:cover}.gallery-grid img:first-child{grid-column:1/3;height:260px}
    #cb-showcase-v2 .hero{background-image:none!important;background-color:var(--navy);isolation:isolate}
    #cb-showcase-v2 .hero:after{content:"";position:absolute;z-index:1;inset:0;background:linear-gradient(180deg,rgba(8,24,27,.48),rgba(8,24,27,.12) 42%,rgba(8,24,27,.88))}
    #cb-showcase-v2 .hero-slides{position:absolute;inset:0;z-index:0}
    #cb-showcase-v2 .hero-slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .85s ease}
    #cb-showcase-v2 .hero-slide.active{opacity:1}
    #cb-showcase-v2 .slider-controls{position:absolute;z-index:5;right:22px;bottom:24px;display:flex;align-items:center;gap:8px}
    #cb-showcase-v2 .slider-controls button{width:44px;height:44px;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(8,24,27,.7);color:white;display:inline-flex;align-items:center;justify-content:center}
    #cb-showcase-v2 .slider-arrow{font:400 25px/1 Arial,sans-serif;transform:translateY(-1px)}
    #cb-showcase-v2 .slider-dots{display:flex;gap:6px;margin-right:5px}
    #cb-showcase-v2 .slider-dot{width:8px!important;height:8px!important;min-width:8px;border:0!important;padding:0;border-radius:50%;background:rgba(255,255,255,.5)!important}
    #cb-showcase-v2 .slider-dot.active{background:var(--yellow)!important}
    @media(min-width:700px){#cb-showcase-v2 .slider-controls{right:42px;bottom:42px}.hero-slide[data-kind="interior"]{background-position:center 58%}}
    @media(max-width:699px){#cb-showcase-v2 .slider-controls{right:18px;bottom:18px}.hero-slide[data-kind="interior"]{background-position:56% center}.hero-slide[data-kind="facade"]{background-position:center}}
    @media(prefers-reduced-motion:reduce){#cb-showcase-v2 .hero-slide{transition:none}}
    #cb-showcase-v2 .rating{background:var(--terracotta);color:white;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
    #cb-showcase-v2 .rating .score{display:flex;align-items:center;justify-content:center;gap:10px;margin:0;color:white;font-family:Arial,sans-serif;font-size:50px;line-height:1;font-variant-numeric:tabular-nums lining-nums;letter-spacing:0}
    #cb-showcase-v2 .rating .score-number{display:inline-block;white-space:nowrap;line-height:1}
    #cb-showcase-v2 .rating .score-star{display:inline-block;font-size:36px;line-height:1;color:#ffe682}
    #cb-showcase-v2 .rating .tag{display:block;color:white!important;line-height:1.4}.rating p{font-size:17px;line-height:1.55;margin:4px auto 0;max-width:320px;color:white}
    #cb-showcase-v2 .visit{background:var(--cream)}
    #cb-showcase-v2 .visit h2{color:var(--navy)}
    #cb-showcase-v2 .details{margin-top:28px;border-top:1px solid #cfc8bd}
    #cb-showcase-v2 .detail{display:grid;grid-template-columns:100px 1fr;padding:16px 0;border-bottom:1px solid #cfc8bd;font-size:14px}
    #cb-showcase-v2 .detail strong{color:var(--ink)}.detail span{color:#556265}
    #cb-showcase-v2 .mapbox{background:var(--navy);color:white;margin-top:26px;padding:0;overflow:hidden;border-radius:0;display:flex;flex-direction:column}
    #cb-showcase-v2 .mapbox iframe{display:block;width:100%;min-height:300px;flex:1;border:0}
    #cb-showcase-v2 .map-actions{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 22px;background:var(--navy)}
